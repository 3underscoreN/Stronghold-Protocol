services:
  app:
    build: 
      context: .
    container_name: stronghold_protocol_app_container
    volumes:
      - ./public/assets:/app/public/assets:ro
      - ./data/local-assets.json:/app/data/local-assets.json:ro
      - ./data/local-fx.json:/app/data/local-fx.json:ro
    environment:
      - PORT=3000
      - SP_BOT_REHERSAL=host
      - SP_COMBAT=client
      - SP_VERIFY=off
    restart: unless-stopped

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    container_name: stronghold_protocol_oauth2_proxy_container
    command:
      - --alpha-config=/etc/oauth2-proxy/alpha-config.yaml
    environment:
      GOOGLE_OAUTH_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_REDIRECT_URL: ${OAUTH2_PROXY_REDIRECT_URL}
      OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE: /etc/oauth2-proxy/allowed-emails.txt
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
    volumes:
      - ./oauth2-proxy/alpha-config.yaml:/etc/oauth2-proxy/alpha-config.yaml:ro
      - ./oauth2-proxy/allowed-emails.txt:/etc/oauth2-proxy/allowed-emails.txt:ro
    expose:
      - "4180"
    depends_on:
      - app
      - nginx
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: stronghold_protocol_nginx_container
    ports:
      - "35555:3000"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - oauth2-proxy
    restart: unless-stopped